
name: Build and Deploy Docker Application

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v4

      - name: Se connecter a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ghcr.io/yimdjikarel-web/projet-devops:latest
            ghcr.io/yimdjikarel-web/projet-devops:${{ github.sha }}

  deploy:
    name: Deploy on Ubuntu Server
    needs: build
    runs-on: [self-hosted, Linux, X64, label-1]

    steps:
      - name: Recuperer la derniere image Docker
        run: docker pull ghcr.io/yimdjikarel-web/projet-devops:latest

      - name: Deployer l'application
        run: |
          cd /vagrant/app
          docker compose pull web
          docker compose up -d --no-build web
